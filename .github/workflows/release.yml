name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Build release archives
        run: |
          make release VERSION="${GITHUB_REF_NAME}" COMMIT="$(git rev-parse --short=12 HEAD)"
          ./build/agentbridge-linux-amd64 version | grep -F "agentbridge ${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "${notes_file}" ]]; then
            gh release create "${GITHUB_REF_NAME}" release/* \
              --verify-tag \
              --title "AgentBridge ${GITHUB_REF_NAME}" \
              --notes-file "${notes_file}"
          else
            gh release create "${GITHUB_REF_NAME}" release/* \
              --verify-tag \
              --title "AgentBridge ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
